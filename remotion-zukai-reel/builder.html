<title>図解リール ビルダー</title>
<style>

  body{background:var(--bg);color:var(--ink);margin:0}
  .wrap{max-width:1200px;margin:0 auto;padding-block:14px;padding-left:16px;padding-right:16px}
  h1{font-size:18px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12.5px;margin:0 0 14px;line-height:1.5}
  .sub b{color:var(--gold);font-weight:700}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-weight:700}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

  .cols{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}

  .screen{width:100%;background:#000;border-radius:16px;overflow:hidden;position:relative;
    aspect-ratio:1080/1920;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .stagewrap{position:relative;width:100%;aspect-ratio:1080/1920}
  .stage{position:absolute;top:0;left:0;width:1080px;height:1920px;transform-origin:top left;
    background:var(--r-bg)}
  .stage *{box-sizing:border-box}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;position:sticky;top:8px}
  .grp{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .grp:first-child{border-top:0;margin-top:0;padding-top:0}
  .grp>.gt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    font-weight:700;margin-bottom:8px}
  .fld{margin-bottom:9px}
  .fld>label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px}
  .fld input[type=text],.fld textarea,.fld select{width:100%;background:var(--panel2);
    border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 9px;font-size:13px;
    font-family:inherit}
  .fld textarea{resize:vertical;min-height:40px;line-height:1.4}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .rng{display:flex;align-items:center;gap:8px}
  .rng input[type=range]{flex:1;accent-color:var(--accent)}
  .rng .val{font-size:11.5px;color:var(--ink);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .hint{font-size:11px;color:var(--dim);margin:2px 0 0;line-height:1.45}
  .hint code{background:var(--panel2);padding:1px 5px;border-radius:5px;color:var(--gold)}

  .bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button.act{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.act:hover{border-color:var(--accent)}

  dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;
    padding:16px;max-width:560px;width:92vw}

  dialog textarea{width:100%;min-height:230px;background:var(--bg);border:1px solid var(--line);

  .sw{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:#fff}
  .savednote{font-size:11px;color:var(--ok);margin-left:auto;align-self:center}

/* ===== 状態（localStorage） ===== */
const LSK="zukai-builder-v3";
let state, sel=0;
function load(){ try{const r=localStorage.getItem(LSK); if(r) return JSON.parse(r);}catch(e){} return null; }
function save(){ try{localStorage.setItem(LSK,JSON.stringify(state)); flash("保存済み");}catch(e){} }
state = load() || JSON.parse(JSON.stringify(DEFAULT));
let flashT; function flash(t){const e=document.getElementById("saved");e.textContent=t;clearTimeout(flashT);flashT=setTimeout(()=>e.textContent="",1400);}

/* ===== 強調マークアップ → HTML ===== */
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function rich(s){
  let h=esc(s);
  h=h.replace(/\*\*([^*]+)\*\*/g,`<span style="font-size:96px;color:${C.gold}">$1</span>`);
  h=h.replace(/\*([^*]+)\*/g,`<span style="color:${C.accent}">$1</span>`);
  return h;
}

/* ===== プレビュー描画（1080x1920絶対座標・静止最終状態） ===== */
const D={HEADER_TOP:170,BOX_TOP:520,BOX_H:118,CXL:300,CXR:780,CENTER:540,STMT_TOP:760,
  NUM_TOP:930,NOTE_TOP:1070,PILL_TOP:1160,FOOT_TOP:1360,ART_TOP:940};
function line(x1,y1,x2,y2,col=C.ink,w=5){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;}
function poly(pts,col,w){return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;}

function headerBox(h,fsH){
  const sub = h.sub?`<div style="text-align:center;font-size:36px;font-weight:700;color:${C.textgray};margin-top:12px">${esc(h.sub)}</div>`:"";
  return `<div style="position:absolute;left:0;top:${D.HEADER_TOP}px;width:1080px;display:flex;flex-direction:column;align-items:center">
    <div style="border:5px solid ${C.ink};border-radius:18px;background:#fff;padding:22px 34px;display:inline-flex;align-items:center;gap:18px;justify-content:center;max-width:1000px">
      <div style="width:11px;height:56px;background:${C.accent};border-radius:4px;flex-shrink:0"></div>
      <div style="font-size:${fsH||64}px;font-weight:700;color:${C.ink};line-height:1.2;white-space:nowrap">${esc(h.title)}</div>
    </div>${sub}</div>`;
}
function boxFill(b){
  if(b.variant==="red")return`background:${C.accent};color:#fff;border:4px solid ${C.accent}`;
  if(b.variant==="navy")return`background:${C.ink};color:#fff;border:4px solid ${C.ink}`;
  return`background:#fff;color:${C.ink};border:4px solid ${C.ink}`;
}
function boxView(b,w){
  const badge=b.badge?`<div style="position:absolute;top:-18px;right:-18px;width:44px;height:44px;border-radius:50%;background:${b.badge==="check"?C.green:C.accent};color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid #fff">${b.badge==="check"?"✓":"×"}</div>`:"";
  const sub=b.sub?`<div style="text-align:center;font-size:34px;font-weight:700;color:${C.textgray};margin-top:12px;width:${w}px">${esc(b.sub)}</div>`:"";
  return `<div style="position:relative">
    <div style="border-radius:16px;padding:22px 14px;text-align:center;font-size:50px;font-weight:700;white-space:nowrap;${boxFill(b)}">${esc(b.label)}</div>${badge}${sub}</div>`;
}
function absBox(cx,top,w,inner){return `<div style="position:absolute;left:${cx-w/2}px;top:${top}px;width:${w}px">${inner}</div>`;}

function renderDiagram(p){
  const F=p.fs||{}, n=(p.boxes||[]).length, two=n>=2, one=n===1;
  const hasSub=(p.boxes||[]).some(b=>b.sub);
  const headBottom=p.header.sub?384:322;
  let svg="";
  if(n>0){
    if(two){
      svg+=line(D.CENTER,headBottom,D.CENTER,470);
      svg+=line(D.CXL,470,D.CXR,470);
      svg+=line(D.CXL,470,D.CXL,D.BOX_TOP);
      svg+=line(D.CXR,470,D.CXR,D.BOX_TOP);
      if(p.statement){
        if(hasSub){svg+=line(D.CENTER,702,D.CENTER,D.STMT_TOP-32,C.accent,6);}
        else{
          svg+=`<path d="M${D.CXL} ${D.BOX_TOP+D.BOX_H} L${D.CXL} 690 L${D.CENTER} 690" fill="none" stroke="${C.accent}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
          svg+=`<path d="M${D.CXR} ${D.BOX_TOP+D.BOX_H} L${D.CXR} 690 L${D.CENTER} 690" fill="none" stroke="${C.accent}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
          svg+=line(D.CENTER,690,D.CENTER,D.STMT_TOP-32,C.accent,6);
        }
      }
    }else{
      svg+=line(D.CENTER,headBottom,D.CENTER,D.BOX_TOP);
      if(p.statement)svg+=line(D.CENTER,D.BOX_TOP+D.BOX_H,D.CENTER,D.STMT_TOP-32,C.accent,6);
    }
  }
  let h=`<svg width="1080" height="1920" style="position:absolute;top:0;left:0">${svg}</svg>`;
  h+=headerBox(p.header,F.header);
  if(one)h+=absBox(D.CENTER,D.BOX_TOP,500,boxView(p.boxes[0],500));
  if(two){h+=absBox(D.CXL,D.BOX_TOP,360,boxView(p.boxes[0],360));h+=absBox(D.CXR,D.BOX_TOP,360,boxView(p.boxes[1],360));}
  if(p.statement)h+=absBox(D.CENTER,D.STMT_TOP,1000,`<div style="text-align:center;font-size:${F.stmt||84}px;font-weight:700;color:${C.ink};line-height:1.15">${rich(p.statement)}</div>`);
  if(p.art&&p.art!=="none")h+=`<div style="position:absolute;left:0;top:${D.ART_TOP}px;width:1080px;display:flex;justify-content:center">${ART[p.art].svg(p.artSize||220)}</div>`;
  if(p.note)h+=absBox(D.CENTER,D.NOTE_TOP,1000,`<div style="text-align:center;font-size:${F.note||34}px;font-weight:700;color:${C.textgray}">${esc(p.note)}</div>`);
  return `<div style="position:absolute;inset:0;transform:translateY(${p.offset??60}px)">${h}</div>`;
}

function renderCompare(p){
  const F=p.fs||{}, CXL=290,CXR=790,CEN=540,CW=460,CT=452,CH=388,cb=CT+CH;
  const headBottom=p.header.sub?384:322;
  let svg=line(CEN,headBottom,CEN,412)+line(CXL,412,CXR,412)+line(CXL,412,CXL,CT)+line(CXR,412,CXR,CT);
  if(p.statement){
    svg+=`<path d="M${CXL} ${cb} L${CXL} 892 L${CEN} 892" fill="none" stroke="${C.accent}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
    svg+=`<path d="M${CXR} ${cb} L${CXR} 892 L${CEN} 892" fill="none" stroke="${C.accent}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
    svg+=line(CEN,892,CEN,936,C.accent,6);
  }
  const card=(sd)=>`<div style="position:relative;width:${CW}px">
    <div style="border:4px solid ${sd.accent};border-radius:20px;background:#fff;overflow:hidden">
      <div style="background:${sd.accent};color:#fff;font-size:46px;font-weight:700;text-align:center;padding:14px 0">${esc(sd.label)}</div>
      <div style="padding:22px 22px 26px;display:flex;justify-content:center">${ART[sd.art]?ART[sd.art].svg(360):""}</div>
    </div>
    <div style="position:absolute;top:-22px;right:-22px;width:56px;height:56px;border-radius:50%;background:${sd.badge==="check"?C.green:C.accent};color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;border:4px solid #fff">${sd.badge==="check"?"✓":"×"}</div></div>`;
  let h=`<svg width="1080" height="1920" style="position:absolute;top:0;left:0">${svg}</svg>`;
  h+=headerBox(p.header,F.header);
  h+=`<div style="position:absolute;left:${CXL-CW/2}px;top:${CT}px;width:${CW}px">${card(p.left)}</div>`;
  h+=`<div style="position:absolute;left:${CXR-CW/2}px;top:${CT}px;width:${CW}px">${card(p.right)}</div>`;
  if(p.statement)h+=`<div style="position:absolute;left:40px;top:968px;width:1000px;text-align:center;font-size:${F.stmt||84}px;font-weight:700;color:${C.ink};line-height:1.15">${rich(p.statement)}</div>`;
  if(p.note)h+=`<div style="position:absolute;left:40px;top:1130px;width:1000px;text-align:center;font-size:${F.note||34}px;font-weight:700;color:${C.textgray}">${esc(p.note)}</div>`;
  if(p.footer)h+=`<div style="position:absolute;left:40px;top:1240px;width:1000px;text-align:center;font-size:${F.foot||54}px;font-weight:700;color:${C.ink};line-height:1.2">${rich(p.footer)}</div>`;
  return `<div style="position:absolute;inset:0;transform:translateY(${p.offset??60}px)">${h}</div>`;
}

function renderChart(p){
  const F=p.fs||{}, r=p.result,cm=p.compare;
  const total=(+r.base)+(+r.delta), max=Math.max(total,+cm.value)||1;
  const H=470, BASE=1010, unit=H/max, BW=236, CXL=336, CXR=744;
  const baseH=r.base*unit, deltaH=r.delta*unit, cmpH=cm.value*unit;
  const baseColor=C.green, deltaColor=C.gold, cmpColor=C.textgray;
  const leftBaseTop=BASE-baseH, leftDeltaTop=BASE-baseH-deltaH, cmpTop=BASE-cmpH, cmpLevel=BASE-baseH;
  const barCss=(cx,top,hh,col,rt)=>`position:absolute;left:${cx-BW/2}px;top:${top}px;width:${BW}px;height:${Math.max(0,hh)}px;background:${col};border:4px solid ${C.ink};border-bottom:none;border-top-left-radius:${rt?12:0}px;border-top-right-radius:${rt?12:0}px`;
  let h=headerBox(p.header,F.header);
  h+=`<svg width="1080" height="1920" style="position:absolute;top:0;left:0">
    ${line(150,BASE,930,BASE,C.ink,6)}
    <line x1="${CXL}" y1="${cmpLevel}" x2="${CXR+BW/2}" y2="${cmpLevel}" stroke="${C.accent}" stroke-width="5" stroke-dasharray="14 12" opacity="0.9"/></svg>`;
  h+=`<div style="${barCss(CXL,leftBaseTop,baseH,baseColor,false)}"></div>`;
  h+=`<div style="${barCss(CXL,leftDeltaTop,deltaH,deltaColor,true)}"></div>`;
  h+=`<div style="${barCss(CXR,cmpTop,cmpH,cmpColor,true)}"></div>`;
  if(p.deltaCallout)h+=`<div style="position:absolute;left:${CXL+BW/2+8}px;top:${leftDeltaTop-8}px;width:300px;font-size:52px;font-weight:700;color:${C.accent};white-space:nowrap">${esc(p.deltaCallout)}</div>`;
  h+=`<div style="position:absolute;left:${CXL-160}px;top:${BASE-total*unit-74}px;width:320px;text-align:center;font-size:60px;font-weight:700;color:${C.ink};white-space:nowrap">${esc(r.topLabel)}</div>`;
  h+=`<div style="position:absolute;left:${CXR-160}px;top:${cmpTop-74}px;width:320px;text-align:center;font-size:60px;font-weight:700;color:${cmpColor};white-space:nowrap">${esc(cm.topLabel)}</div>`;
  h+=`<div style="position:absolute;left:${CXL-200}px;top:${BASE+18}px;width:400px;text-align:center;font-size:40px;font-weight:700;color:${C.ink};white-space:nowrap">${esc(r.caption)}</div>`;
  h+=`<div style="position:absolute;left:${CXR-200}px;top:${BASE+18}px;width:400px;text-align:center;font-size:40px;font-weight:700;color:${C.textgray};white-space:nowrap">${esc(cm.caption)}</div>`;
  if(p.pill)h+=`<div style="position:absolute;left:130px;top:1160px;width:820px;background:${C.ink};color:#fff;border-radius:20px;padding:26px 0;text-align:center;font-size:${F.pill||58}px;font-weight:700;line-height:1.25">${rich(p.pill)}</div>`;
  if(p.footer)h+=`<div style="position:absolute;left:40px;top:1360px;width:1000px;text-align:center;font-size:${F.foot||54}px;font-weight:700;color:${C.ink};line-height:1.2">${rich(p.footer)}</div>`;
  return `<div style="position:absolute;inset:0;transform:translateY(${p.offset??60}px)">${h}</div>`;
}

function renderStage(){
  const p=state.pages[sel];
  const stage=document.getElementById("stage");
  stage.innerHTML = p.type==="compare"?renderCompare(p):p.type==="chart"?renderChart(p):renderDiagram(p);
  fitStage();
}
function fitStage(){
  const wrap=document.querySelector(".stagewrap");
  const s=wrap.clientWidth/1080;
  document.getElementById("stage").style.transform=`scale(${s})`;
}
new ResizeObserver(fitStage).observe(document.querySelector(".stagewrap"));

/* ===== コントロールパネル ===== */
function upd(){ save(); renderStage(); }
function txt(label,val,on,ph=""){const d=el("div","fld");d.innerHTML=`<label>${label}</label>`;const i=document.createElement("input");i.type="text";i.value=val||"";i.placeholder=ph;i.oninput=e=>{on(e.target.value);};i.onchange=save;d.appendChild(i);return d;}
function area(label,val,on,hint){const d=el("div","fld");d.innerHTML=`<label>${label}</label>`;const t=document.createElement("textarea");t.value=val||"";t.oninput=e=>on(e.target.value);t.onchange=save;d.appendChild(t);if(hint){const p=document.createElement("p");p.className="hint";p.innerHTML=hint;d.appendChild(p);}return d;}
function rng(label,val,min,max,step,on){const d=el("div","fld");d.innerHTML=`<label>${label}</label>`;const r=el("div","rng");const i=document.createElement("input");i.type="range";i.min=min;i.max=max;i.step=step;i.value=val;const v=el("span","val");v.textContent=val;i.oninput=e=>{v.textContent=e.target.value;on(+e.target.value);};i.onchange=save;r.appendChild(i);r.appendChild(v);d.appendChild(r);return d;}
function sel1(label,val,opts,on){const d=el("div","fld");d.innerHTML=`<label>${label}</label>`;const s=document.createElement("select");opts.forEach(o=>{const op=document.createElement("option");op.value=o.v;op.textContent=o.t;if(o.v===val)op.selected=true;s.appendChild(op);});s.onchange=e=>{on(e.target.value);save();};d.appendChild(s);return d;}
function colorPick(label,val,on){const d=el("div","fld");d.innerHTML=`<label>${label}</label>`;const sw=el("div","swatch");const cols=[["ネイビー",C.ink],["赤",C.accent],["グレー",C.textgray],["緑",C.green],["金",C.gold]];cols.forEach(([t,c])=>{const b=document.createElement("div");b.className="sw"+(c===val?" on":"");b.style.background=c;b.title=t;b.onclick=()=>{on(c);save();};sw.appendChild(b);});d.appendChild(sw);return d;}
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function grp(title){const g=el("div","grp");g.innerHTML=`<div class="gt">${title}</div>`;return g;}
const ARTOPTS=ART_KEYS.map(k=>({v:k,t:ART[k].label}));
const VAROPTS=[{v:"outline",t:"白枠(ネイビー)"},{v:"navy",t:"ネイビー塗り"},{v:"red",t:"赤塗り"}];
const BADGEOPTS=[{v:"",t:"なし"},{v:"check",t:"✓ 緑"},{v:"cross",t:"× 赤"}];

function buildPanel(){
  const p=state.pages[sel], panel=document.getElementById("panel"); panel.innerHTML="";
  const g0=grp(`${p.key}：見出し`);
  g0.appendChild(txt("タイトル",p.header.title,v=>{p.header.title=v;renderStage();}));
  g0.appendChild(txt("サブ見出し（任意）",p.header.sub,v=>{p.header.sub=v||undefined;renderStage();}));
  panel.appendChild(g0);

  if(p.type==="diagram"){
    (p.boxes||[]).forEach((b,i)=>{
      const g=grp(`ボックス${i+1}`);
      g.appendChild(txt("ラベル",b.label,v=>{b.label=v;renderStage();}));
      g.appendChild(txt("サブ文字（任意）",b.sub,v=>{b.sub=v||undefined;renderStage();}));
      g.appendChild(sel1("見た目",b.variant||"outline",VAROPTS,v=>{b.variant=v;renderStage();}));
      g.appendChild(sel1("バッジ",b.badge||"",BADGEOPTS,v=>{b.badge=v||undefined;renderStage();}));
      panel.appendChild(g);
    });
    const gb=grp("ボックス数");
    gb.appendChild(sel1("箱の数",String((p.boxes||[]).length),[{v:"0",t:"0個"},{v:"1",t:"1個"},{v:"2",t:"2個"}],v=>{
      const n=+v; p.boxes=p.boxes||[]; while(p.boxes.length<n)p.boxes.push({label:"項目",variant:"outline"}); p.boxes.length=n; buildPanel(); renderStage();
    }));
    panel.appendChild(gb);

    const g2=grp("本文・注記");
    g2.appendChild(area("結論(大)",p.statement,v=>{p.statement=v;renderStage();},"強調：<code>*赤*</code> / <code>**金・特大**</code>"));
    g2.appendChild(txt("注記（任意）",p.note,v=>{p.note=v||undefined;renderStage();}));
    panel.appendChild(g2);

    const g3=grp("イラスト");
    g3.appendChild(sel1("種類",p.art||"none",ARTOPTS,v=>{p.art=v;renderStage();}));
    g3.appendChild(rng("大きさ",p.artSize||220,80,520,5,v=>{p.artSize=v;renderStage();}));
    panel.appendChild(g3);

    const g4=grp("文字サイズ");
    g4.appendChild(rng("見出し",(p.fs&&p.fs.header)||64,40,90,1,v=>{p.fs=p.fs||{};p.fs.header=v;renderStage();}));
    g4.appendChild(rng("結論",(p.fs&&p.fs.stmt)||84,50,130,1,v=>{p.fs=p.fs||{};p.fs.stmt=v;renderStage();}));
    g4.appendChild(rng("注記",(p.fs&&p.fs.note)||34,22,50,1,v=>{p.fs=p.fs||{};p.fs.note=v;renderStage();}));
    panel.appendChild(g4);
  }

  if(p.type==="compare"){
    ["left","right"].forEach((side,i)=>{
      const sd=p[side], g=grp(i===0?"左カード":"右カード");
      g.appendChild(txt("ラベル",sd.label,v=>{sd.label=v;renderStage();}));
      g.appendChild(sel1("イラスト",sd.art,ARTOPTS,v=>{sd.art=v;renderStage();}));
      g.appendChild(sel1("バッジ",sd.badge,[{v:"check",t:"✓ 緑"},{v:"cross",t:"× 赤"}],v=>{sd.badge=v;renderStage();}));
      g.appendChild(colorPick("枠・帯の色",sd.accent,v=>{sd.accent=v;renderStage();}));
      panel.appendChild(g);
    });
    const g2=grp("本文");
    g2.appendChild(area("結論(大)",p.statement,v=>{p.statement=v;renderStage();},"強調：<code>*赤*</code> / <code>**金・特大**</code>"));
    g2.appendChild(txt("注記（任意）",p.note,v=>{p.note=v||undefined;renderStage();}));
    g2.appendChild(area("締めの一文（任意）",p.footer,v=>{p.footer=v||undefined;renderStage();}));
    panel.appendChild(g2);
    const g4=grp("文字サイズ");
    g4.appendChild(rng("結論",(p.fs&&p.fs.stmt)||84,50,130,1,v=>{p.fs=p.fs||{};p.fs.stmt=v;renderStage();}));
    panel.appendChild(g4);
  }

  if(p.type==="chart"){
    const gL=grp("左の棒（結果）");
    gL.appendChild(rng("土台(万円)",+p.result.base,0,1500,10,v=>{p.result.base=v;renderStage();}));
    gL.appendChild(rng("増加分(万円)",+p.result.delta,0,1000,10,v=>{p.result.delta=v;renderStage();}));
    gL.appendChild(txt("上のラベル",p.result.topLabel,v=>{p.result.topLabel=v;renderStage();}));
    gL.appendChild(txt("下のキャプション",p.result.caption,v=>{p.result.caption=v;renderStage();}));
    panel.appendChild(gL);
    const gR=grp("右の棒（比較）");
    gR.appendChild(rng("金額(万円)",+p.compare.value,0,1500,10,v=>{p.compare.value=v;renderStage();}));
    gR.appendChild(txt("上のラベル",p.compare.topLabel,v=>{p.compare.topLabel=v;renderStage();}));
    gR.appendChild(txt("下のキャプション",p.compare.caption,v=>{p.compare.caption=v;renderStage();}));
    panel.appendChild(gR);
    const g2=grp("ラベル・帯");
    g2.appendChild(txt("差分の吹き出し",p.deltaCallout,v=>{p.deltaCallout=v||undefined;renderStage();}));
    g2.appendChild(area("紺の帯(pill)",p.pill,v=>{p.pill=v||undefined;renderStage();},"強調：<code>*赤*</code>"));
    g2.appendChild(area("締めの一文",p.footer,v=>{p.footer=v||undefined;renderStage();},"強調：<code>*赤*</code>"));
    panel.appendChild(g2);
  }

  const gz=grp("配置・速度（共通）");
  gz.appendChild(rng("全体の縦位置",p.offset??60,-80,220,2,v=>{p.offset=v;renderStage();}));
  gz.appendChild(rng("出現スピード(大=ゆっくり)",p.speed??1,0.4,1.8,0.1,v=>{p.speed=v;renderStage();}));
  panel.appendChild(gz);
}

/* ===== タブ ===== */
function buildTabs(){
  const t=document.getElementById("tabs"); t.innerHTML="";
  state.pages.forEach((p,i)=>{
    const b=el("button","tab"+(i===sel?" active":""));
    b.textContent=p.key; b.onclick=()=>{sel=i;buildTabs();buildPanel();renderStage();};
    t.appendChild(b);
  });
}

/* ===== ボタン ===== */
document.getElementById("copyBtn").onclick=async()=>{
  const json=JSON.stringify(state,null,2);
  try{await navigator.clipboard.writeText(json);flash("コピーしました");}
  catch(e){showJson(json);}
};
document.getElementById("showBtn").onclick=()=>showJson(JSON.stringify(state,null,2));
function showJson(j){const d=document.getElementById("dlg");document.getElementById("dlgTxt").value=j;d.showModal();document.getElementById("dlgTxt").select();}
document.getElementById("resetBtn").onclick=()=>{
  state.pages[sel]=JSON.parse(JSON.stringify(DEFAULT.pages[sel]));save();buildPanel();renderStage();flash("初期化しました");
};

/* ===== 起動 ===== */
buildTabs(); buildPanel(); renderStage();
</script>
